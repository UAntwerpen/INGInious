name: Build and push docker-compose images

on:
  push:
    branches:
      - main
    paths:
      - base-containers/base/**
      - deploy/Containerfile
      - docker-compose.yml
      - uantwerpen/containers/**
      - .github/workflows/build-docker-compose.yml

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  VERSION: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Buildx bootstrap attempt ${attempt}/5"
            docker buildx rm ci-builder >/dev/null 2>&1 || true
            if docker buildx create --name ci-builder --driver docker-container --use; then
              if docker buildx inspect --bootstrap; then
                docker buildx ls
                exit 0
              fi
            fi

            sleep_seconds=$((attempt * 10))
            echo "Buildx bootstrap failed, retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done
          echo "Buildx bootstrap failed after 5 attempts"
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build base environment images (from base-containers/base/Dockerfile with multiple targets)
      - name: Build and push env-base
        uses: docker/build-push-action@v6
        with:
          context: ./base-containers/base/
          target: env-base
          push: true
          tags: |
            ghcr.io/uantwerpen/inginious/env-base:latest
            ghcr.io/uantwerpen/inginious/env-base:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      - name: Build and push env-default
        uses: docker/build-push-action@v6
        with:
          context: ./base-containers/base/
          target: env-default
          push: true
          tags: |
            ghcr.io/uantwerpen/inginious/env-default:latest
            ghcr.io/uantwerpen/inginious/env-default:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

       - name: Build and push env-python3
         uses: docker/build-push-action@v6
         with:
           context: ./base-containers/base/
           target: env-python3
           push: true
           tags: |
             ghcr.io/uantwerpen/inginious/env-python3:latest
             ghcr.io/uantwerpen/inginious/env-python3:${{ env.VERSION }}
           build-args: |
             VERSION=${{ env.VERSION }}
             REGISTRY=${{ env.REGISTRY }}

       # Build core images (from deploy/Containerfile with multiple targets)
      - name: Build and push core-backend
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./deploy/Containerfile
          target: backend
          push: true
          tags: |
            ghcr.io/uantwerpen/inginious/core-backend:latest
            ghcr.io/uantwerpen/inginious/core-backend:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      - name: Build and push core-agent_docker
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./deploy/Containerfile
          target: agent_docker
          push: true
          tags: |
            ghcr.io/uantwerpen/inginious/core-agent_docker:latest
            ghcr.io/uantwerpen/inginious/core-agent_docker:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      - name: Build and push core-agent_mcq
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./deploy/Containerfile
          target: agent_mcq
          push: true
          tags: |
            ghcr.io/uantwerpen/inginious/core-agent_mcq:latest
            ghcr.io/uantwerpen/inginious/core-agent_mcq:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      - name: Build and push core-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./deploy/Containerfile
          target: frontend
          push: true
          tags: |
            ghcr.io/uantwerpen/inginious/core-frontend:latest
            ghcr.io/uantwerpen/inginious/core-frontend:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

       - name: Build and push env-computer-graphics
         uses: docker/build-push-action@v6
         with:
           context: ./uantwerpen/containers/computer-graphics/
           push: true
           tags: |
             ghcr.io/uantwerpen/inginious/env-computer-graphics:latest
             ghcr.io/uantwerpen/inginious/env-computer-graphics:${{ env.VERSION }}
           build-args: |
             VERSION=${{ env.VERSION }}
             REGISTRY=${{ env.REGISTRY }}

       - name: Build and push env-cpp
         uses: docker/build-push-action@v6
         with:
           context: ./uantwerpen/containers/cpp/
           push: true
           tags: |
             ghcr.io/uantwerpen/inginious/env-cpp:latest
             ghcr.io/uantwerpen/inginious/env-cpp:${{ env.VERSION }}
           build-args: |
             VERSION=${{ env.VERSION }}
             REGISTRY=${{ env.REGISTRY }}
