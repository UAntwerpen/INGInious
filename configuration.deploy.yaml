backend: tcp://backend:2000
backup_directory: /inginious/backups
local-config: {}
mongo_opt:
  database: INGInious
  host: db
session_parameters:
  ignore_change_ip: false
  secret_key: e028b8a554667cc6fa421d19138f645baa80dadff471677dfd0417d8810a9a43
  secure: true
  timeout: 86400
plugins:
  # The uantwerpen.plugins.* modules are UAntwerpen-internal and are not
  # shipped in this image; add them back only if the `uantwerpen` package is
  # installed in the frontend container.
  # SAML2 (UAntwerpen login) is the ONLY auth method, so every sign-in goes
  # through it. LDAP login has been removed on purpose; re-adding any auth
  # plugin here brings back the method chooser on the sign-in page.
  # Provided via the ./uantwerpen bind-mount on /inginious/uantwerpen
  # (see docker-compose.yml). uantwerpen/ and uantwerpen/plugins/ have no
  # __init__.py and load as PEP 420 namespace packages.
  - plugin_module: uantwerpen.plugins.inginious-download-submissions
  - plugin_module: uantwerpen.plugins.inginious-extra-test
  - plugin_module: uantwerpen.plugins.inginious-run-code
  - plugin_module: inginious.frontend.plugins.auth.saml2_auth
    id: "saml2"
    name: "UAntwerpen login"
    strict: true
    sp:
      entityId: "https://inginious.uantwerpen.be/auth/saml2/metadata"
      assertionConsumerService:
        url: "https://inginious.uantwerpen.be/auth/callback/saml2"
        binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
      x509cert: ""
      privateKey: ""
    idp:
      entityId: "https://sts.windows.net/792e08fb-2d54-4a8e-af72-202548136ef6/"
      singleSignOnService:
        url: "https://login.microsoftonline.com/792e08fb-2d54-4a8e-af72-202548136ef6/saml2"
        binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
      singleLogoutService:
        url: "https://login.microsoftonline.com/792e08fb-2d54-4a8e-af72-202548136ef6/saml2"
        binding: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
      x509cert: ""
    security:
      requestedAuthnContext: false
    attributes:
      cn: "http://schemas.microsoft.com/identity/claims/displayname"
      uid: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"
      email: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"
  # DEV ONLY. Exposes GET /dev-login which logs in the user below without any
  # external auth. Inert unless INGINIOUS_DEV_LOGIN is set in the environment
  # (see docker-compose.yml). Remove this entry for production.
  - plugin_module: inginious.frontend.plugins.auth.dev_auth
    username: tapers
    realname: "Tim Apers"
    email: tapers@dev.local
# Disable the local DB registration / password login path. This makes /register
# return 403 and hides the username/password form on the sign-in page.
allow_registration: false
log_level: DEBUG
superadmins:
  - superadmin  # seeded by deploy/init-mongo.js in the compose stack
  - tapers
  - thofkens
tasks_directory: uantwerpen/courses
use_minified_js: false
webdav_host: https://localhost/dav
smtp:
  host: smtp.uantwerpen.be
  sendername: INGInious UAntwerpen <noreply@uantwerpen.be>
  port: 0
